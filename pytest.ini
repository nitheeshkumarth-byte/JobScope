[pytest]
# Scrapling ships its own test suite inside the vendored Scrapling-main/ tree.
# Without this, a bare `pytest` recurses into it and dies on collection because
# those tests need pytest-httpbin and scrapy, which this project does not
# install. testpaths keeps a bare run pointed at this project's own tests.
testpaths = tests

norecursedirs = Scrapling-main node_modules .git .venv venv __pycache__

# Board tests stub the network rather than calling out, but anything left live is
# slow, not fast, so keep the default reporting readable.
addopts = -q

# cv_ocr has one test that renders a real page and runs real OCR (~5s). It is
# kept in the default run because it is the only thing proving the contact line
# survives a genuine round trip; the marker exists so it can be deselected with
# -m "not slow" when iterating.
markers =
    slow: exercises real OCR or the network and takes seconds, not milliseconds