<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found - JobScope</title>
  <meta name="description" content="That page does not exist. Head back to the JobScope candidate or recruiter portal.">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f3f2fc;--ink:#14123a;--muted:#5b5889;--accent:#4f46e5;--line:#d8d6ee}
    @media (prefers-color-scheme: dark){:root{--paper:#0b0a1f;--ink:#eceafc;--muted:#9a97c4;--accent:#8f7fff;--line:#2a2756}}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Figtree","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;line-height:1.5}
    main{max-width:460px;text-align:center}
    .mark{width:44px;height:44px;margin:0 auto 22px;border-radius:12px;display:grid;place-items:center;
      background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font:700 24px "Bricolage Grotesque",system-ui,sans-serif}
    h1{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;font-size:clamp(28px,6vw,38px);letter-spacing:-.02em;margin-bottom:10px}
    p{color:var(--muted);margin-bottom:24px}
    .links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    a{display:inline-block;padding:10px 18px;border-radius:8px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
    a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    a:hover{filter:brightness(1.08)}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">J</div>
    <h1>Page not found</h1>
    <p>The link may be old, or the address may have a typo.</p>
    <div class="links">
      <a class="primary" href="/">Home</a>
      <a href="/candidate">Candidate portal</a>
      <a href="/recruiter">Recruiter portal</a>
    </div>
  </main>
</body>
</html>
